version: '3.8'

services:
  bot:
    build: .
    container_name: lentagram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lentagram-network

networks:
  lentagram-network:
    driver: bridge
